services:
  - type: web
    name: circular-refurbishment-intelligence
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && flask db upgrade && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /api/health
    plan: standard
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: IS_PRODUCTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: circular-refurbishment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CIRCULAR_API_KEY
        generateValue: true
      - key: COLLECTION_API_URL
        sync: false
      - key: COLLECTION_API_KEY
        sync: false
      - key: UPLOAD_STORAGE_PATH
        value: /var/data/uploads
    disk:
      name: uploads-disk
      mountPath: /var/data/uploads
      sizeGB: 10

databases:
  - name: circular-refurbishment-db
    plan: standard
    databaseName: refurbishment_db
    user: circular_admin
